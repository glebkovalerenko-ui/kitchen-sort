<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- ИЗМЕНЕНИЕ: Запрет зума и адаптация под мобилки -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Kitchen Sort</title>
    
    <script>
        (function() {
            const hostname = window.location.hostname;
            const isLocal = (
                hostname === 'localhost' ||
                hostname === '127.0.0.1' ||
                hostname.startsWith('192.168.')
            );
            
            const script = document.createElement('script');
            
            if (isLocal) {
                script.src = '/YandexSDKMock.js';
                console.log('LOADING LOCAL YANDEX SDK MOCK. Hostname:', hostname);
            } else {
                script.src = 'https://yandex.ru/games/sdk/v2';
                console.log('Loading official Yandex SDK.');
            }
            
            document.head.appendChild(script);
        }());
    </script>
    
    <style>
        /* ИЗМЕНЕНИЕ: Полный сброс стилей для предотвращения скролла */
        html, body { 
            margin: 0; 
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #333333; /* Цвет фона как в игре, чтобы не моргало белым */
            overflow: hidden; /* Убирает скроллбары */
            position: fixed;  /* Фиксирует страницу на iOS (анти-резинка) */
            top: 0;
            left: 0;
            
            /* Отключение выделения и системных меню */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none; /* Отключает меню при долгом тапе на iOS */
        }
        
        canvas {
            display: block; /* Убирает отступы у inline-элементов */
            outline: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
            
            /* Сообщаем браузеру, что касания обрабатывает приложение */
            touch-action: none; 
        }
    </style>
</head>
<!-- ИЗМЕНЕНИЕ: oncontextmenu блокирует ПКМ, ondragstart блокирует перетаскивание картинок браузером -->
<body oncontextmenu="return false;" ondragstart="return false;">
    <script type="module" src="/src/main.js"></script>
</body>
</html>
