<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kitchen Sort</title>
    
    <script>
        (function() {
            const hostname = window.location.hostname;
            const isLocal = (
                hostname === 'localhost' ||
                hostname === '127.0.0.1' ||
                hostname.startsWith('192.168.')
            );
            
            const script = document.createElement('script');
            
            if (isLocal) {
                script.src = '/YandexSDKMock.js';
                console.log('LOADING LOCAL YANDEX SDK MOCK. Hostname:', hostname);
            } else {
                script.src = 'https://yandex.ru/games/sdk/v2';
                console.log('Loading official Yandex SDK.');
            }
            
            document.head.appendChild(script);
        }());
    </script>
    
    <style>
        body { 
            margin: 0; 
            background-color: #111; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            /* --- СТИЛИ ДЛЯ ОТКЛЮЧЕНИЯ ВЫДЕЛЕНИЯ --- */
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10+ */
            user-select: none; /* Standard syntax */
        }
        canvas {
            outline: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0); /* Отключает подсветку при тапе на iOS */
        }
    </style>
</head>
<!-- ИЗМЕНЕНИЕ: Добавлен oncontextmenu для блокировки ПКМ на всей странице -->
<body oncontextmenu="return false;">
    <script type="module" src="/src/Main.js"></script>
</body>
</html>
